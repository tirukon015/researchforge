<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1600" height="1270" fill="#ffffff"/><text x="40" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start" style="">ResearchForge: data flow through one analysis</text><text x="40" y="82" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start" style="">Whole-document grounded generation. No embeddings, no vector search, no retrieval step: this is not RAG.</text><rect x="40" y="120" width="520" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="56" y="148" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" style="">PDF bytes (multipart upload)</text><text x="56" y="174" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">read once; size checked on the real byte count</text><rect x="40" y="226" width="520" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="254" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Validate  (src/ingestion/pdf.py)</text><text x="56" y="280" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">%PDF signature · empty-password decrypt attempt</text><text x="56" y="301" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">near-empty text layer -&gt; rejected as scanned (422)</text><rect x="40" y="356" width="520" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Extract + clean  (pypdf)</text><text x="56" y="410" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">ligatures normalised · hyphenated breaks rejoined</text><text x="56" y="431" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">spaces collapsed, newlines kept · nothing removed</text><rect x="40" y="486" width="520" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="514" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Content hash  (SHA-256 of cleaned text)</text><text x="56" y="540" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">+ ANALYSIS_VERSION  -&gt;  analysis_cache lookup</text><rect x="40" y="606" width="520" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="56" y="634" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="start" style="">Fits in context?  (400,000 characters)</text><text x="56" y="660" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">yes: whole paper is the context (chunk_count = 1)</text><text x="56" y="681" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">no: 40,000-char chunks, 2,000 overlap, one digest</text><text x="56" y="702" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">call per chunk, digests concatenated (map-reduce)</text><rect x="40" y="756" width="520" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="784" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Three structured model calls, in sequence</text><text x="56" y="810" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">grounding system prompt (src/prompts/analysis.py)</text><text x="56" y="831" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">1  Summary</text><text x="56" y="852" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">2  ResearchGaps  (each gap carries its evidence)</text><text x="56" y="873" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">3  LiteratureReview  (prior work the paper discusses)</text><text x="56" y="894" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">schema sent as JSON Schema, extra fields forbidden</text><rect x="40" y="956" width="520" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="984" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Validate every reply  (Pydantic)</text><text x="56" y="1010" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">truncated or malformed -&gt; refused (502), never repaired</text><text x="56" y="1031" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">insufficient_evidence fields let the model decline</text><rect x="40" y="1086" width="520" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="1114" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">AnalysisResponse  -&gt;  browser</text><text x="56" y="1140" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">+ provenance: provider, model, fallback_used, elapsed ms</text><path d="M 300.0 196 L 300.0 222" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300.0 326 L 300.0 352" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300.0 456 L 300.0 482" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300.0 566 L 300.0 602" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300.0 726 L 300.0 752" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300.0 926 L 300.0 952" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 300.0 1056 L 300.0 1082" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="314.0" y="592" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="start" style="">miss</text><rect x="620" y="480" width="400" height="92" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="636" y="508" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="start" style="">Cache hit</text><text x="636" y="534" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">stored analysis returned</text><text x="636" y="555" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">cache_hit = true · no model call</text><path d="M 560 526 L 616 526" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="516" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">hit</text><rect x="620" y="756" width="400" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="636" y="784" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">RoutedLLMProvider (per request)</text><text x="636" y="810" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">primary = owner&#x27;s choice (system_settings)</text><text x="636" y="831" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">fallback = the other provider</text><text x="636" y="852" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">switches at most once per analysis,</text><text x="636" y="873" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">only for rate limits / transient failures</text><text x="636" y="894" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">a disabled provider is never constructed</text><path d="M 560 841 L 616 841" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="956" width="400" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="636" y="984" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">analysis_cache  (write on success only)</text><text x="636" y="1010" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">keyed by content hash + analysis version</text><text x="636" y="1031" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">a failure is never cached</text><path d="M 560 1006 L 616 1006" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1080" y="700" width="480" height="84" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1096" y="728" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Anthropic API</text><text x="1096" y="754" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Claude (default claude-opus-5)</text><rect x="1080" y="830" width="480" height="84" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1096" y="858" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Groq API</text><text x="1096" y="884" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Qwen 3.6 27B (qwen/qwen3.6-27b)</text><path d="M 1020 800 L 1076 750" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1020 870 L 1076 870" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1080" y="956" width="480" height="210" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1096" y="984" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Library  (only when the user saves)</text><text x="1096" y="1010" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">POST /api/papers -&gt; papers + analyses rows,</text><text x="1096" y="1031" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">written as the signed-in user; RLS scopes rows</text><text x="1096" y="1052" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">POST /api/reviews/cross reads the STORED</text><text x="1096" y="1073" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">analyses of 2+ papers (not the PDFs),</text><text x="1096" y="1094" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">makes one model call, and writes</text><text x="1096" y="1115" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">literature_reviews + literature_review_papers</text><path d="M 560 1126 L 600 1126 L 600 1190 L 1320.0 1190 L 1320.0 1170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="820" y="1182" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">user clicks Save to library</text><text x="40" y="1222" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" style="">The PDF itself is not stored: papers.storage_path exists in the schema but is unused.</text><rect x="1080" y="140" width="34" height="20" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1126" y="155" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Current: implemented</text><rect x="1080" y="168" width="34" height="20" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1126" y="183" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">External service</text><rect x="1080" y="196" width="34" height="20" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1126" y="211" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Decision point</text><text x="40" y="1248" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Verified against the ResearchForge repository at commit 33bc740 (2026-09-06). Diagram built 2026-09-25.</text></svg>