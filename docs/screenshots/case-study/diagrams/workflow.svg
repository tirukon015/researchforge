<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><text x="40" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start" style="">ResearchForge: the verified user workflow</text><text x="40" y="82" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start" style="">Traced from the Next.js routes and API calls. Each step names the screen and endpoint that implement it.</text><rect x="40" y="140" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="56" y="168" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">1  Sign in</text><text x="56" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/sign-in or Google</text><text x="56" y="215" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Supabase Auth session</text><path d="M 320 199.0 L 343 199.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="140" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="361" y="168" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">2  Upload a PDF</text><text x="361" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/dashboard drop zone</text><text x="361" y="215" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">type, empty, 25 MB checks</text><path d="M 625 199.0 L 648 199.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="140" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="666" y="168" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">3  Analyse</text><text x="666" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">POST /api/analyze</text><text x="666" y="215" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">1 to 3 minutes typical</text><path d="M 930 199.0 L 953 199.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="955" y="140" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="971" y="168" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">4  Read the result</text><text x="971" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">tabs: Summary · Gaps ·</text><text x="971" y="215" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Literature Review · Paper info</text><path d="M 1235 199.0 L 1258 199.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1260" y="140" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1276" y="168" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">5  Save to library</text><text x="1276" y="194" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">POST /api/papers</text><text x="1276" y="215" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">analysis passed back, not re-run</text><rect x="320" y="330" width="310" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="336" y="358" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="start" style="">Rejected upload</text><text x="336" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">422 not a PDF, scanned, encrypted</text><text x="336" y="405" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">413 over 25 MB</text><rect x="645" y="330" width="290" height="104" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="661" y="358" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="start" style="">Same text seen before</text><text x="661" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">content-hash cache hit</text><text x="661" y="405" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">stored result, 0 model calls</text><rect x="950" y="330" width="330" height="104" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="966" y="358" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="start" style="">Provider problem</text><text x="966" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">429 rate limit (Retry-After)</text><text x="966" y="405" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">502 unusable reply · 503 no key</text><path d="M 700 258 L 475 326" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M 790 258 L 790 326" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M 880 258 L 1115 326" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="190" y="560" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="206" y="588" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">6  My Papers</text><text x="206" y="614" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/papers: search, filter,</text><text x="206" y="635" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">sort, open, delete</text><path d="M 470 619.0 L 513 619.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="560" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="531" y="588" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">7  Select 2 or more</text><text x="531" y="614" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">papers with stored analyses</text><text x="531" y="635" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">checkbox selection</text><path d="M 795 619.0 L 838 619.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="840" y="560" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="856" y="588" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">8  Cross-paper review</text><text x="856" y="614" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">POST /api/reviews/cross</text><text x="856" y="635" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">one model call</text><path d="M 1120 619.0 L 1163 619.0" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1165" y="560" width="280" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1181" y="588" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">9  Read + copy</text><text x="1181" y="614" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/literature-review</text><text x="1181" y="635" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">copy buttons; no file export</text><path d="M 1400.0 258 L 1400.0 500 L 330.0 500 L 330.0 556" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="492" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">saved papers accumulate</text><rect x="1180" y="740" width="380" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1196" y="768" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Owner only: Settings  -&gt;  AI</text><text x="1196" y="794" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">choose primary: Claude or Groq Qwen 3.6 27B</text><text x="1196" y="815" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">the other becomes the automatic fallback</text><text x="1196" y="836" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">switch a provider off entirely</text><text x="1196" y="857" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">enforced by the API and by RLS</text><rect x="40" y="750" width="34" height="20" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="86" y="765" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Current: implemented</text><rect x="40" y="778" width="34" height="20" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="86" y="793" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Decision point</text><rect x="40" y="806" width="34" height="20" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="86" y="821" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Rejected / error outcome</text><text x="40" y="870" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start" style="">Not in the product: search inside papers, notes, tags or folders, citation export,</text><text x="40" y="892" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start" style="">collaboration or sharing, OCR. The literature review covers the prior work the papers themselves discuss.</text><text x="40" y="978" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Verified against the ResearchForge repository at commit 33bc740 (2026-09-06). Diagram built 2026-09-25.</text></svg>