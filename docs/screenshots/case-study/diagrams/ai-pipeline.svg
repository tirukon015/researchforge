<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1600" height="820" fill="#ffffff"/><text x="40" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start" style="">ResearchForge: provider routing and fallback</text><text x="40" y="82" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start" style="">src/rag/llm/router.py. One switch per analysis, and only for failures another vendor could plausibly fix.</text><rect x="60" y="130" width="330" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="76" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Build router for this request</text><text x="76" y="184" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">read owner&#x27;s primary (system_settings)</text><text x="76" y="205" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">read enabled providers</text><text x="76" y="226" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">unreadable setting -&gt; env default</text><rect x="460" y="130" width="330" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="476" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Call the primary</text><text x="476" y="184" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">generate_structured(...)</text><text x="476" y="205" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">or generate_text(...) for digests</text><path d="M 390 190 L 456 190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="860" y="130" width="300" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="876" y="158" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Success</text><text x="876" y="184" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">model_provider = primary</text><text x="876" y="205" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">fallback_used = false</text><path d="M 790 170 L 856 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="823" y="160" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">ok</text><rect x="460" y="330" width="330" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="476" y="358" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#78350f" text-anchor="start" style="">Is the error retryable?</text><text x="476" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">whitelist in is_retryable():</text><text x="476" y="405" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">LLMRateLimitError  -&gt; yes</text><text x="476" y="426" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">bare LLMError (5xx, timeout)  -&gt; yes</text><text x="476" y="447" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#78350f" text-anchor="start" style="">anything else -&gt; no</text><path d="M 625 250 L 625 326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="655" y="295" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5">error</text><rect x="60" y="350" width="330" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="76" y="378" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="start" style="">Raise the real error</text><text x="76" y="404" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">LLMCredentialsError -&gt; 503</text><text x="76" y="425" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">LLMResponseError -&gt; 502</text><text x="76" y="446" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">no fallback configured -&gt; raise</text><path d="M 460 405 L 394 405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="427" y="395" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">no</text><rect x="860" y="330" width="330" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="876" y="358" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Switch to the fallback</text><text x="876" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">only if it is enabled</text><text x="876" y="405" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">stays switched for every later</text><text x="876" y="426" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">call in this analysis</text><path d="M 790 405 L 856 405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="823" y="395" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">yes</text><rect x="1260" y="330" width="300" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1276" y="358" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Fallback result</text><text x="1276" y="384" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">recorded as produced by</text><text x="1276" y="405" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">the fallback provider</text><text x="1276" y="426" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">fallback_used = true</text><path d="M 1190 380 L 1256 380" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1223" y="370" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">ok</text><rect x="1260" y="540" width="300" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="1276" y="568" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d" text-anchor="start" style="">Both failed</text><text x="1276" y="594" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">one LLMError naming both</text><text x="1276" y="615" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="start" style="">vendors&#x27; messages; no 3rd try</text><path d="M 1025 480 L 1025 595 L 1256 595" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1140" y="585" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">error</text><rect x="60" y="560" width="700" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="588" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start" style="">Why these rules (from the module docstring)</text><text x="76" y="614" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Per-call failover would let different sections be written by different models,</text><text x="76" y="635" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">making the stored &quot;model used&quot; a fiction. Retrying a bad PDF, a validation failure</text><text x="76" y="656" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">or a missing key on a second vendor spends a second quota to get the same error</text><text x="76" y="677" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">and hides the real cause. The whitelist means a new error type is not retryable by default.</text><rect x="820" y="580" width="34" height="20" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="866" y="595" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Current: implemented</text><rect x="820" y="608" width="34" height="20" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="866" y="623" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Decision point</text><rect x="820" y="636" width="34" height="20" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="866" y="651" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start" style="">Rejected / error outcome</text><text x="40" y="798" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Verified against the ResearchForge repository at commit 33bc740 (2026-09-06). Diagram built 2026-09-25.</text></svg>