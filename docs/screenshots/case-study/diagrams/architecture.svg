<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1600" height="1080" fill="#ffffff"/><text x="40" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start" style="">ResearchForge: system architecture</text><text x="40" y="82" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="start" style="">One Vercel project, two services behind one origin. Data access runs as the signed-in user, so Postgres RLS decides what exists.</text><rect x="600" y="110" width="400" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="800.0" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" style="">Browser</text><text x="800.0" y="164" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="middle" style="">Next.js client  ·  supabase-js (sign-in only)</text><rect x="60" y="240" width="1480" height="430" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="80" y="270" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" style="">Vercel project &quot;researchforge&quot;  ·  researchforge.rukon.dev  ·  one origin</text><rect x="90" y="285" width="1420" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="106" y="313" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" style="">vercel.json rewrites  ·  /api/* and /health -&gt; backend service  ·  every other path -&gt; frontend service</text><rect x="90" y="370" width="600" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="106" y="398" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">Next.js 16 frontend  (app/)</text><rect x="597" y="382" width="81" height="22" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="637.5" y="398" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle" style="">CURRENT</text><text x="106" y="424" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">React 19 · TypeScript strict · plain CSS</text><text x="106" y="445" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/                     public landing page</text><text x="106" y="466" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/sign-in  /sign-up  /forgot-password  /reset-password</text><text x="106" y="487" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/auth/callback        Google OAuth (PKCE)</text><text x="106" y="508" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/dashboard            upload + analysis</text><text x="106" y="529" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/papers  /papers/[id] private library</text><text x="106" y="550" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/literature-review    cross-paper review</text><text x="106" y="571" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/workspace  /settings (account, owner AI config)</text><text x="106" y="592" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">AuthGate: UX redirect only, not the security boundary</text><rect x="760" y="370" width="750" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="776" y="398" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="start" style="">FastAPI backend  (src/)  ·  Python  ·  maxDuration 300 s</text><rect x="1417" y="382" width="81" height="22" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="1457.5" y="398" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle" style="">CURRENT</text><text x="776" y="424" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">POST /api/analyze        PDF -&gt; validate -&gt; extract -&gt; cache -&gt; 3 model passes</text><text x="776" y="445" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/api/papers              save · list · stats · open · delete</text><text x="776" y="466" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/api/reviews             cross-paper literature review (from stored analyses)</text><text x="776" y="487" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">/api/owner               status, AI provider choice + availability</text><text x="776" y="508" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">GET /health              library: bool, auth: bool (no URLs, no keys)</text><text x="776" y="529" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">require_user             token checked with Supabase /auth/v1/user, 5 s cache</text><text x="776" y="550" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">RoutedLLMProvider        owner&#x27;s primary + at most one fallback</text><text x="776" y="571" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">pypdf ingestion · Pydantic schemas · versioned prompts</text><path d="M 690 510 L 756 510" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="723" y="480" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">Bearer token</text><text x="723" y="497" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">relative /api path</text><path d="M 800 194 L 800 281" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="812" y="222" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" fill="#334155" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5">HTTPS</text><rect x="60" y="730" width="330" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="76" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Supabase Auth</text><rect x="288" y="742" width="90" height="22" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="333.0" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle" style="">EXTERNAL</text><text x="76" y="784" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">email + password</text><text x="76" y="805" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Google sign-in (PKCE)</text><text x="76" y="826" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">issues the user&#x27;s access token</text><rect x="420" y="730" width="400" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="436" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Supabase Postgres</text><rect x="718" y="742" width="90" height="22" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="763.0" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle" style="">EXTERNAL</text><text x="436" y="784" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">papers · analyses · literature_reviews</text><text x="436" y="805" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">analysis_cache · system_settings · app_owners</text><text x="436" y="826" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Row Level Security: user_id = auth.uid()</text><rect x="850" y="730" width="330" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="866" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Anthropic API</text><rect x="1078" y="742" width="90" height="22" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="1123.0" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle" style="">EXTERNAL</text><text x="866" y="784" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">Claude</text><text x="866" y="805" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">default model: claude-opus-5</text><text x="866" y="826" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">one of the two routed providers</text><rect x="1210" y="730" width="330" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1226" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#4c1d95" text-anchor="start" style="">Groq API</text><rect x="1438" y="742" width="90" height="22" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="1483.0" y="758" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#4c1d95" text-anchor="middle" style="">EXTERNAL</text><text x="1226" y="784" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">OpenAI-compatible endpoint</text><text x="1226" y="805" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">default model: qwen/qwen3.6-27b</text><text x="1226" y="826" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#1e293b" text-anchor="start" style="">one of the two routed providers</text><path d="M 600 150 L 30 150 L 30 795 L 56 795" fill="none" stroke="#475569" stroke-width="2" marker-end="ur